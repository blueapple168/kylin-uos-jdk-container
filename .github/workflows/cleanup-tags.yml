name: 清理多余镜像 tag

# 一次性任务：registry 上只保留 10 个规范 tag。
# 用 GitHub package API 删 version，这样连「tag 被覆盖后变成 untagged」的旧版本也能清掉
# （registry 的 tags/list 看不到 untagged，只靠 DELETE manifest 删不干净）。
# 用完即删本文件。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出要删的，不真删"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: 清理 tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 删除非规范 version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          PKG="$(echo '${{ github.repository }}' | cut -d/ -f2 | tr 'A-Z' 'a-z')"
          OWNER="${{ github.repository_owner }}"
          API="https://api.github.com/user/packages/container/${PKG}/versions"

          # 规范 tag：以 uos- / kylin- 开头
          is_spec() { case "$1" in uos-*|kylin-*) return 0 ;; *) return 1 ;; esac; }

          # 拉全部 version（含 untagged），分页直到取完
          : > /tmp/versions.jsonl
          page=1
          while :; do
            chunk="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}?per_page=100&page=${page}")"
            n="$(printf '%s' "$chunk" | jq 'length')"
            [ "$n" -gt 0 ] || break
            printf '%s' "$chunk" | jq -c '.[]' >> /tmp/versions.jsonl
            [ "$n" -lt 100 ] && break
            page=$((page + 1))
          done
          echo "共 $(grep -c . /tmp/versions.jsonl || true) 个 version"

          keep=0; deleted=0; patched=0
          while IFS= read -r v; do
            [ -n "$v" ] || continue
            vid="$(printf '%s' "$v" | jq -r '.id')"
            tags="$(printf '%s' "$v" | jq -r '[.metadata.container.tags[]?] | join(",")')"

            # 拆出规范 tag 与待删 tag
            spec=""; junk=""
            IFS=',' read -ra arr <<< "$tags"
            for t in "${arr[@]:-}"; do
              [ -n "$t" ] || continue
              if is_spec "$t"; then spec="${spec}${t} "; else junk="${junk}${t} "; fi
            done

            if [ -z "$spec" ]; then
              # 没有任何规范 tag：整个 version 删掉（含 untagged 的旧版本）
              if [ "${DRY_RUN}" = "true" ]; then
                echo "  [dry-run] 删除 version ${vid}  tags=[${tags}]"
              else
                code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  "${API}/${vid}")"
                echo "  删除 version ${vid} tags=[${tags}] -> HTTP ${code}"
              fi
              deleted=$((deleted + 1))
            elif [ -n "$junk" ]; then
              # 同一 version 上既有规范 tag 又有杂 tag：只摘掉杂 tag
              spec_json="$(printf '%s' "$spec" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -sc .)"
              if [ "${DRY_RUN}" = "true" ]; then
                echo "  [dry-run] 摘 tag ${junk}（保留 ${spec}）version ${vid}"
              else
                code="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
                  -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" \
                  -d "{\"metadata\":{\"container\":{\"tags\":${spec_json}}}}" \
                  "${API}/${vid}")"
                echo "  摘 tag ${junk}（保留 ${spec}）-> HTTP ${code}"
              fi
              patched=$((patched + 1))
            else
              keep=$((keep + 1))
            fi
          done < /tmp/versions.jsonl

          {
            echo "### tag 清理结果"
            echo ""
            echo "- 保留 ${keep} 个纯规范 version"
            echo "- 删除 ${deleted} 个非规范 / untagged version"
            echo "- 摘 tag ${patched} 个（同一 version 上混有杂 tag）"
            echo "- dry_run=${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
