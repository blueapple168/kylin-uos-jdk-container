name: 清理多余镜像 tag

# 一次性任务：删掉 registry 上除规范 tag 外的所有 tag。
# 只删「digest 不被任何规范 tag 引用」的 manifest，避免误删正在用的镜像。
# 用完即删本文件。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出要删的，不真删"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  cleanup:
    name: 清理 tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 删除非规范 tag
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eux
          REPO="$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')"
          # push scope 才能删 manifest
          TOKEN="$(curl -fsS -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:${REPO}:pull,push&service=ghcr.io" | jq -r .token)"
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"

          digest_of() {
            curl -fsSI -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
              "https://ghcr.io/v2/${REPO}/manifests/$1" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'
          }

          ALL_TAGS="$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${REPO}/tags/list" | jq -r '.tags[]?' | sort)"
          echo "当前共 $(printf '%s\n' "$ALL_TAGS" | grep -c . || true) 个 tag"

          # 规范 tag 以 uos- / kylin- 开头
          KEEP="$(printf '%s\n' "$ALL_TAGS" | grep -E '^(uos-|kylin-)' || true)"
          DROP="$(printf '%s\n' "$ALL_TAGS" | grep -vE '^(uos-|kylin-)' || true)"
          echo "保留 $(printf '%s\n' "$KEEP" | grep -c . || true) 个规范 tag"
          echo "待删 $(printf '%s\n' "$DROP" | grep -c . || true) 个"

          # 规范 tag 占用的 digest，这些 manifest 绝对不能删
          KEEP_DIGESTS=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            d="$(digest_of "$t" || true)"
            [ -n "$d" ] && KEEP_DIGESTS="${KEEP_DIGESTS}${d}"$'\n'
          done <<< "$KEEP"

          deleted=0
          skipped=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            d="$(digest_of "$t" || true)"
            if [ -z "$d" ]; then
              echo "  跳过 ${t}: 取不到 digest"
              skipped=$((skipped + 1)); continue
            fi
            if printf '%s' "$KEEP_DIGESTS" | grep -qxF "$d"; then
              # 与某个规范 tag 共用 manifest，删 manifest 会连规范 tag 一起废掉
              echo "  跳过 ${t}: 与规范 tag 共用 manifest ${d:0:20}"
              skipped=$((skipped + 1)); continue
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              echo "  [dry-run] 将删除 ${t}  ${d:0:20}"
            else
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer ${TOKEN}" \
                "https://ghcr.io/v2/${REPO}/manifests/${t}")"
              echo "  删除 ${t} -> HTTP ${code}"
              [ "$code" = "202" ] || [ "$code" = "200" ] || [ "$code" = "204" ] || true
            fi
            deleted=$((deleted + 1))
          done <<< "$DROP"

          {
            echo "### tag 清理结果"
            echo ""
            echo "- 处理 $(printf '%s\n' "$DROP" | grep -c . || true) 个非规范 tag"
            echo "- 删除 ${deleted} 个，跳过 ${skipped} 个"
            if [ "$skipped" -gt 0 ]; then
              echo ""
              echo "> 跳过的 tag 与规范 tag 共用 manifest，registry API 无法单独摘 tag。"
              echo "> 它们在 GHCR 包页面上可手动删除，或等下次构建覆盖后自然消失。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
