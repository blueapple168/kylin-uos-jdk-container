name: 镜像功能与版本验证

# 对每个变体、每个架构实际启动容器，逐项验证：
#   系统标识 / 架构 / java+javac 版本与发行商 / JAVA_HOME / 编译运行 / MaxRAMPercentage
#   dumb-init / gosu / app 用户 / OTel Agent / entrypoint / 时区 / 中文 locale / FFmpeg
#
# 触发方式:
#   workflow_run      构建 workflow 成功后自动跑（全量，保证覆盖）
#   workflow_dispatch 手动跑，可只验证某个变体或单个架构
#   schedule          每日巡检，防止镜像被覆盖或上游漂移
#
# 变体清单读 .github/variants.txt，与构建 workflow 共用同一份，避免两处不同步。

on:
  workflow_run:
    workflows: ["JDK UOS 双架构镜像构建"]
    types: [completed]
  workflow_dispatch:
    inputs:
      variant:
        description: "只验证指定变体（填历史 tag 或规范 tag，如 jdk17 / uos-20-1070a-openjdk-17.0.9.0.9-2.0.2；留空验证全部）"
        required: false
        default: ""
      platforms:
        description: "验证的架构，逗号分隔；留空为 amd64+arm64"
        required: false
        default: "linux/amd64,linux/arm64"
  schedule:
    # 每日 UTC 04:00（北京 12:00），与构建 workflow 的 02:00 错开
    - cron: "0 4 * * *"

concurrency:
  group: verify-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  plan:
    name: 生成验证矩阵
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算验证矩阵
        id: set
        env:
          WANT: ${{ github.event.inputs.variant }}
          PLATS: ${{ github.event.inputs.platforms }}
        run: |
          set -eux
          WANT="${WANT:-}"
          PLATS="${PLATS:-}"
          [ -n "$PLATS" ] || PLATS="linux/amd64,linux/arm64"

          # 提取 ARG 默认值并去掉两侧引号，与构建 workflow 的 get_arg 保持一致
          get_arg() {
            sed -nE "s/^ARG[[:space:]]+$2=([^ #]+).*/\1/p" "$1" \
              | head -n1 \
              | sed -E 's/^"(.*)"$/\1/; s/^'\''(.*)'\''$/\1/'
          }

          # 按「系统-系统版本-发行版-JDK版本[-特性]」拼规范 tag，与构建 workflow 一致
          make_tag() {
            local dir="$1" df="$2" v_os="$3" v_osver="$4" v_vendor="$5" v_flavor="$6"
            local jdkver=""
            case "$v_vendor" in
              # OpenJDK 版本由 UOS 仓库决定，构建后才确定，这里留空
              openjdk)    jdkver="" ;;
              dragonwell) jdkver="$(get_arg "${dir}/${df}" DRAGONWELL_RAW)" ;;
              temurin)    jdkver="$(get_arg "${dir}/${df}" JDKVER_RAW)" ;;
            esac
            if [ -z "$jdkver" ] && [ "$v_vendor" != "openjdk" ]; then
              echo "::error::${dir}/${df}: 解析不到 JDK 版本" >&2
              return 1
            fi
            jdkver="${jdkver//+/-}"
            local t="${v_os}-${v_osver}-${v_vendor}-${jdkver}"
            [ -n "$v_flavor" ] && t="${t}-${v_flavor}"
            printf '%s' "$t"
          }

          # 期望 JDK 版本要原样传给容器内脚本（保留 +，脚本自己判主版本）
          # OpenJDK 留空：脚本内改读 rpm 实际版本，tag 一致性由 tag-check job 校验
          jdk_raw() {
            local dir="$1" df="$2" vendor="$3"
            case "$vendor" in
              openjdk)    printf '' ;;
              dragonwell) get_arg "${dir}/${df}" DRAGONWELL_RAW ;;
              temurin)    get_arg "${dir}/${df}" JDKVER_RAW ;;
            esac
          }

          matrix_arr=()
          while IFS='|' read -r dir df tag_old short dwsrc v_os v_osver v_vendor v_flavor; do
            [ -n "$dir" ] || continue
            [ -f "${dir}/${df}" ] || { echo "::warning::跳过不存在的 ${dir}/${df}"; continue; }
            # 规范 tag 可能还没补上（OpenJDK 要构建后才知道版本），所以验证统一用历史 tag 拉镜像，
            # 它一定存在且指向最新构建产物
            if [ -n "$WANT" ] && [ "$WANT" != "$tag_old" ]; then
              continue
            fi

            jdk_ver="$(jdk_raw "$dir" "$df" "$v_vendor")"
            # 架构列表按逗号拆开，一个架构一个矩阵项
            echo "$PLATS" | tr ',' '\n' | while read -r plat; do
              [ -n "$plat" ] || continue
              arch="${plat##*/}"
              printf '%s\n' "{\"tag\":\"${tag_old}\",\"arch\":\"${arch}\",\"platform\":\"${plat}\",\"os\":\"${v_os}\",\"osver\":\"${v_osver}\",\"vendor\":\"${v_vendor}\",\"jdkver\":\"${jdk_ver}\",\"flavor\":\"${v_flavor}\"}"
            done >> /tmp/rows.txt
          done < <(grep -vE '^[[:space:]]*(#|$)' .github/variants.txt)

          if [ -s /tmp/rows.txt ]; then
            matrix="[$(paste -sd, /tmp/rows.txt)]"
          else
            matrix="[]"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

          # 报告用的清单表
          {
            echo "### 本次验证的镜像"
            echo ""
            echo "| 镜像 tag | 架构 | 发行版 | 期望 JDK |"
            echo "|---|---|---|---|"
            printf '%s\n' "$matrix" | jq -r '.[] | "| `\(.tag)` | \(.arch) | \(.vendor) | \(.jdkver // "由仓库决定") |"' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY" || true

  verify:
    name: "验证 (${{ matrix.tag }} / ${{ matrix.arch }})"
    needs: [plan]
    if: >-
      always() &&
      needs.plan.outputs.matrix != '[]' &&
      needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix || '[]') }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU (arm64 需要)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取镜像
        id: pull
        run: |
          set -eux
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z'):${{ matrix.tag }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if docker pull --platform "${{ matrix.platform }}" "${IMAGE}"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::镜像不存在或拉取失败: ${IMAGE} (${{ matrix.platform }})，跳过验证"
          fi

      # label 校验不在这里做：arm64 下 docker pull 后 inspect 常拿到空 Config，
      # 改用 registry API 读该架构的 config blob，放在 tag-check job 里统一校验。

      - name: 容器内功能与版本自检
        id: selftest
        if: steps.pull.outputs.ok == '1'
        run: |
          set -eux
          IMAGE="${{ steps.pull.outputs.image }}"
          docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint sh \
            -v "${GITHUB_WORKSPACE}/.github/scripts/verify-image.sh:/verify.sh:ro" \
            "${IMAGE}" /verify.sh \
              "${{ matrix.os }}" \
              "${{ matrix.osver }}" \
              "${{ matrix.vendor }}" \
              "${{ matrix.jdkver }}" \
              "${{ matrix.arch }}" \
              "${{ matrix.flavor }}" \
            | tee /tmp/selftest.tsv

      - name: 验证 entrypoint 链路 (dumb-init -> gosu app)
        id: entrypoint
        if: steps.pull.outputs.ok == '1'
        run: |
          set -eux
          IMAGE="${{ steps.pull.outputs.image }}"
          # 默认 ENTRYPOINT 是 dumb-init -- docker-entrypoint.sh，末尾 exec gosu app "$@"
          # 传 id 进去，能输出 uid=1000(app) 就说明整条链路通
          OUT="$(docker run --rm --platform "${{ matrix.platform }}" "${IMAGE}" id 2>&1 || true)"
          echo "${OUT}"
          case "${OUT}" in
            *"uid=1000"*) printf 'PASS\tentrypoint 链路\t%s\n' "${OUT}" ;;
            *)            printf 'FAIL\tentrypoint 链路\t%s\n' "${OUT}" ;;
          esac > /tmp/entrypoint.tsv

      - name: 汇总本变体结果
        if: always()
        run: |
          set -eu
          mkdir -p out
          python3 - <<'PY' > "out/${{ matrix.arch }}-${{ matrix.tag }}.json"
          import json, os, glob
          rows, fails = [], 0
          for f in ("/tmp/labels.tsv", "/tmp/selftest.tsv", "/tmp/entrypoint.tsv"):
              if not os.path.exists(f):
                  continue
              for line in open(f, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if not line:
                      continue
                  parts = line.split("\t")
                  if parts[0] == "SUMMARY":
                      fails += int(parts[2]) if len(parts) > 2 and parts[2].isdigit() else 0
                      continue
                  if len(parts) >= 3:
                      rows.append({"status": parts[0], "item": parts[1], "detail": parts[2]})
          if not rows:
              fails += 1
              rows.append({"status": "FAIL", "item": "整体", "detail": "镜像拉取失败，未产生任何检查结果"})
          print(json.dumps({
              "tag": "${{ matrix.tag }}",
              "arch": "${{ matrix.arch }}",
              "platform": "${{ matrix.platform }}",
              "vendor": "${{ matrix.vendor }}",
              "jdkver": "${{ matrix.jdkver }}" or "由仓库决定",
              "fails": fails,
              "checks": rows,
          }, ensure_ascii=False, indent=2))
          PY
          cat "out/${{ matrix.arch }}-${{ matrix.tag }}.json"

      - name: 上传本变体结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.arch }}-${{ matrix.tag }}
          path: out/*.json
          if-no-files-found: warn

  tag-check:
    name: 校验规范 tag 与镜像内容一致
    needs: [plan]
    if: >-
      always() &&
      needs.plan.outputs.matrix != '[]' &&
      needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 逐个变体比对
        run: |
          set -eux
          REPO="$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')"
          IMAGE="${REGISTRY}/${REPO}"
          # 直接用 registry API 取 manifest digest，比 buildx inspect 的模板更稳
          GHCR_TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io" | jq -r .token)"
          # 必须同时接受 index 和单架构 manifest：查 tag 返回 index，
          # 查子 manifest 返回单架构；少了后者会 404
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          digest_of() {
            curl -fsSI -H "Authorization: Bearer ${GHCR_TOKEN}" -H "Accept: ${ACCEPT}" \
              "https://ghcr.io/v2/${REPO}/manifests/$1" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'
          }

          fails=0
          rows=""
          label_rows=""

          # 直接读 registry 里该架构的 config blob 取 Labels。
          # 不用 docker pull + inspect：arm64 下 inspect 常拿到空 Config，读不到 label。
          config_labels() {   # $1=tag  $2=arch
            local md cd
            md="$(curl -fsSL -H "Authorization: Bearer ${GHCR_TOKEN}" -H "Accept: ${ACCEPT}" \
                  "https://ghcr.io/v2/${REPO}/manifests/$1" \
                  | jq -r --arg a "$2" '.manifests[]? | select(.platform.architecture==$a) | .digest' | head -n1)"
            [ -n "$md" ] && [ "$md" != "null" ] || return 1
            cd="$(curl -fsSL -H "Authorization: Bearer ${GHCR_TOKEN}" -H "Accept: ${ACCEPT}" \
                  "https://ghcr.io/v2/${REPO}/manifests/${md}" | jq -r '.config.digest')"
            [ -n "$cd" ] && [ "$cd" != "null" ] || return 1
            curl -fsSL -H "Authorization: Bearer ${GHCR_TOKEN}" \
              "https://ghcr.io/v2/${REPO}/blobs/${cd}" | jq -c '.config.Labels // {}'
          }

          check_labels() {   # $1=tag  $2=os  $3=osver  $4=vendor  $5=jdkver(可空)
            local tag="$1" arch lb k want got pairs
            for arch in amd64 arm64; do
              if ! lb="$(config_labels "$tag" "$arch")"; then
                echo "::error::${tag} ${arch}: 读不到 config blob"
                fails=$((fails + 1))
                label_rows="${label_rows}| \`${tag}\` | ${arch} | - | ❌ 读不到 config |"$'\n'
                continue
              fi
              pairs="os=$2 os.version=$3 jdk.vendor=$4"
              [ -n "$5" ] && pairs="${pairs} jdk.version=$5"
              for kv in $pairs; do
                k="${kv%%=*}"; want="${kv#*=}"
                got="$(printf '%s' "$lb" | jq -r --arg k "$k" '.[$k] // ""')"
                if [ "$got" = "$want" ]; then
                  label_rows="${label_rows}| \`${tag}\` | ${arch} | ${k} | ✅ ${got} |"$'\n'
                else
                  echo "::error::${tag} ${arch}: label ${k} 期望 ${want}，实际 ${got:-空}"
                  fails=$((fails + 1))
                  label_rows="${label_rows}| \`${tag}\` | ${arch} | ${k} | ❌ 期望 ${want}，实际 ${got:-空} |"$'\n'
                fi
              done
            done
          }

          while IFS='|' read -r dir df tag_old short dwsrc v_os v_osver v_vendor v_flavor; do
            [ -n "$dir" ] || continue
            [ -f "${dir}/${df}" ] || continue

            # 期望的 JDK 版本：Dragonwell/Temurin 来自 Dockerfile ARG；
            # OpenJDK 来自仓库，只能拉镜像进容器读实际装上的 NEVRA
            case "$v_vendor" in
              openjdk)
                docker pull -q --platform linux/amd64 "${IMAGE}:${tag_old}"
                jdkver="$(docker run --rm --platform linux/amd64 --entrypoint sh "${IMAGE}:${tag_old}" \
                  -c 'PKG="$(rpm -qa | grep -- -openjdk-devel | head -1)"; rpm -q --qf "%{VERSION}-%{RELEASE}" "$PKG"')"
                jdkver="$(printf '%s' "$jdkver" | tr -d '\r\n')"
                ;;
              dragonwell)
                jdkver="$(sed -nE 's/^ARG[[:space:]]+DRAGONWELL_RAW=([^ #]+).*/\1/p' "${dir}/${df}" | head -n1 | tr -d '"')"
                ;;
              temurin)
                jdkver="$(sed -nE 's/^ARG[[:space:]]+JDKVER_RAW=([^ #]+).*/\1/p' "${dir}/${df}" | head -n1 | tr -d '"')"
                ;;
            esac
            jdkver="${jdkver//+/-}"
            if [ -z "$jdkver" ]; then
              echo "::error::${dir}/${df}: 取不到 JDK 版本，无法推导规范 tag"
              fails=$((fails + 1))
              continue
            fi

            expect="${v_os}-${v_osver}-${v_vendor}-${jdkver}"
            [ -n "$v_flavor" ] && expect="${expect}-${v_flavor}"

            d_new="$(digest_of "${expect}" || true)"
            if [ -z "$d_new" ]; then
              echo "::error::规范 tag 不存在: ${expect}（历史 tag ${tag_old}）"
              fails=$((fails + 1))
              rows="${rows}| \`${tag_old}\` | \`${expect}\` | ❌ 不存在 |"$'\n'
              continue
            fi
            d_old="$(digest_of "${tag_old}" || true)"
            if [ "$d_new" = "$d_old" ]; then
              echo "PASS ${tag_old} -> ${expect}  ${d_new:0:26}"
              rows="${rows}| \`${tag_old}\` | \`${expect}\` | ✅ digest 一致 |"$'\n'
            else
              echo "::error::digest 不一致 ${tag_old}=${d_old:0:26} vs ${expect}=${d_new:0:26}"
              fails=$((fails + 1))
              rows="${rows}| \`${tag_old}\` | \`${expect}\` | ❌ digest 不一致 |"$'\n'
            fi

            # OpenJDK 的 jdk.version label 写的是 repo 占位，不参与比对
            if [ "$v_vendor" = "openjdk" ]; then
              check_labels "${expect}" "$v_os" "$v_osver" "$v_vendor" ""
            else
              check_labels "${expect}" "$v_os" "$v_osver" "$v_vendor" "${jdkver}"
            fi
          done < <(grep -vE '^[[:space:]]*(#|$)' .github/variants.txt)

          {
            echo "### 规范 tag 一致性"
            echo ""
            echo "| 历史 tag | 规范 tag | 结果 |"
            echo "|---|---|---|"
            printf '%s' "$rows"
            echo ""
            echo "### 镜像 label 校验（读 registry config blob）"
            echo ""
            echo "| 规范 tag | 架构 | label | 结果 |"
            echo "|---|---|---|---|"
            printf '%s' "$label_rows"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fails" -gt 0 ]; then
            echo "::error::${fails} 个变体的规范 tag 与镜像不一致"
            exit 1
          fi

  report:
    name: 生成验证报告
    needs: [plan, verify, tag-check]
    if: always() && needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部结果
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: 汇总报告
        run: |
          set -eu
          python3 .github/scripts/summarize.py results | tee /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 失败则让 job 失败
        run: |
          set -eu
          total_fail="$(python3 .github/scripts/summarize.py results --total-fails)"
          echo "失败检查项总数: ${total_fail}"
          if [ "${total_fail}" -gt 0 ]; then
            echo "::error::验证发现 ${total_fail} 处失败，详见上方报告"
            exit 1
          fi

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            results
            /tmp/report.md
          if-no-files-found: warn
